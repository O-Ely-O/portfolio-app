    <text x="80" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" fill="#1e242e" text-anchor="middle" letter-spacing="0.5">ASSOCIATE</text>

    <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7.5" letter-spacing="1.5" fill="#586b82" text-anchor="middle">CERTIFIED</text>
  </g>


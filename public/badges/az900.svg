    <text x="80" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#1e242e" text-anchor="middle" letter-spacing="0.5">AZURE</text>
    <text x="80" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" fill="#1e242e" text-anchor="middle" letter-spacing="0.5">FUNDAMENTALS</text>
  </g>

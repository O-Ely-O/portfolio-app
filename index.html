<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/x-icon" href="/src/assets/portfolio-icon.svg" />
    <title>My Portfolio</title>
    <meta name="description" content="Production-grade portfolio featuring interactive creative design projects, verified technical certificates, and client collaboration inquiries." />
    <meta property="og:title" content="My Portfolio" />
    <meta property="og:description" content="Production-grade portfolio featuring interactive creative design projects, verified technical certificates, and client collaboration inquiries." />

    <meta name="theme-color" content="#f0f7ff" />

    <!-- Google Fonts with display=swap for zero FOIT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
